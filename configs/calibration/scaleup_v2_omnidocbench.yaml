# Scale-up v2 Stage 6 calibration — OmniDocBench side.
#
# Plan reference: docs/specs/scaleup_v2_plan.md Stage 6.
#
# HISTORY: this config originally specified a 3x3 adaptive grid + 5
# fixed_2b + 4 fixed_8b candidates which over-shot the plan's
# ~8-GPU-hour envelope at the empirically-observed 48 sec/page rate
# (would have taken ~27 GPU-hours for both datasets). The run was
# killed after 8 of 9 adaptive pairs completed; the frozen artifact
# was recovered via scripts/scaleup/recover_calibration_v2.py, which
# selects (B_low, B_high) from the 8 completed pairs and sets
# matched-cost fixed budgets deterministically (measured cost ==
# max_tiles for fixed budgets, so no actual sweep is required).
#
# This config is preserved as-is for audit (the recovery script
# records its path in the frozen artifact's pinning section). For
# Stage 7, ONLY frozen_budgets_v2_omnidocbench.json matters; this
# YAML is read once for its split/model/prompt pinning metadata.
#
# To re-run from scratch (NOT recommended), use the tight grid that
# scaleup_v2_fintabnet.yaml uses (2x2 adaptive + 1 fixed_2b + 1
# fixed_8b, ~5-6 GPU-hr).
run_id: scaleup_v2_calibration_omnidocbench_v1

split:
  manifest_path: data/splits/scaleup_v2/omnidocbench/calibration.json
  records_path: data/omnidocbench/records.json
  image_root: data

prompt_config_path: configs/prompts/table_parse_v2.yaml
model_config_path: configs/models/internvl2_real.yaml

candidates:
  low_max_tiles:        [2, 4, 6]
  high_max_tiles:       [10, 12, 16]
  fixed_2b_max_tiles:   [4, 6, 8, 10, 12]
  fixed_8b_max_tiles:   [6, 8, 10, 12]

# Matched-cost target. The MVP measured adaptive at ~9.5-10.6 tiles/page
# on OmniDocBench; keep the target there for continuity with the MVP's
# headline. The selector picks the adaptive pair within tolerance whose
# measured cost is closest to this value, then matches fixed_2b /
# fixed_8b to the adaptive's measured cost.
target_adaptive_cost_tiles: 10.0
matched_cost_tolerance: 0.10

models:
  adaptive: internvl2-2b
  fixed_2b: internvl2-2b
  fixed_8b: internvl2-8b

output:
  sweep_root: outputs/scaleup_v2/calibration/omnidocbench
  sweep_summaries_path: outputs/scaleup_v2/calibration/omnidocbench_summaries.jsonl
  # Per-dataset frozen artifact. The MVP frozen_budgets.json is
  # preserved as-is (the MVP record) and never overwritten by scale-up
  # v2 runs.
  frozen_budgets_path: configs/calibration/frozen_budgets_v2_omnidocbench.json
