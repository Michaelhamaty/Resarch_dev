# InternVL2 model registry — real GPU runs.
#
# Use this file from a run config when executing on a host with torch +
# transformers + a GPU (e.g. Colab Pro). Importing this YAML alone does
# nothing; the heavy stack is only loaded when `build_adapter` actually
# constructs the InternVL2Adapter.
#
# Both 2B and 8B are wired to the real InternVL2Adapter for scale-up v2.
# Device and dtype are auto-resolved by InternVL2Adapter (cuda + bf16 on
# L4/Ampere+, fp16 on MPS, fp32 on CPU). The plan's "device: cuda:0 /
# dtype: float16" hint is satisfied by auto-detect picking bf16 on L4
# (Ampere sm_89), which is at least as numerically stable as fp16.
models:
  internvl2-2b:
    adapter_kind: internvl2
    model_id: OpenGVLab/InternVL2-2B
    notes: "Small-model baseline; real HF adapter."
  internvl2-8b:
    adapter_kind: internvl2
    model_id: OpenGVLab/InternVL2-8B
    notes: >
      Matched-cost upper-bound baseline; real HF adapter. Smoke-gated by
      scripts/scaleup/smoke_8b_one_page.py per scaleup_v2_plan Stage 2.
