# Phase 2 single-pass run on the REAL InternVL2-2B adapter.
#
# Pointed at the placeholder fixture pages so this run is purely a
# plumbing test: we are confirming that the adapter loads on a real GPU,
# preprocesses an image, and produces parseable output. The placeholder
# images are 8x8 grayscale, so model output will not be meaningful — the
# value of this run is structural, not scientific.
#
# Once this run succeeds end-to-end, the next step is to replace the
# fixture images with real OmniDocBench (or other source) pages.
run_id: colab_real_2b_low_v1

inputs:
  split_name: calibration_split
  manifest_path: data/splits/calibration_split.json
  records_path: data/fixtures/sample_pages.json
  image_root: data

model:
  config_path: configs/models/internvl2_real.yaml
  name: internvl2-2b

budget:
  config_path: configs/budgets/phase2.yaml
  name: low

prompt:
  config_path: configs/prompts/table_parse_v1.yaml

output:
  dir: outputs/runs/colab_real_2b_low_v1
