[project]
name = "adaptive-inference"
version = "0.0.0"
description = "Matched-budget adaptive inference research MVP for complex English table pages."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "pillow>=10",
    "lxml>=5",
    "scipy>=1.10",
    "apted>=1.0.3",
    "huggingface-hub>=1.16.4",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Heavy ML stack — only needed on the GPU VM that actually runs
# adapter inference. Local development and unit tests do NOT need
# these (the InternVL2Adapter imports torch/transformers lazily).
# On the Deep Learning VM image (deeplearning-platform-release /
# pytorch-latest-gpu), these are typically preinstalled into the
# system Python; pinning them here lets `uv sync --extra gpu`
# create a reproducible venv on any L4-class machine.
gpu = [
    "torch>=2.1",
    "transformers>=4.40",
    "torchvision>=0.16",
    "accelerate>=0.30",
    "timm>=0.9",
    "sentencepiece>=0.2",
    "einops>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
