[project]
name = "adaptive-inference"
version = "0.0.0"
description = "Matched-budget adaptive inference research MVP for complex English table pages."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "pillow>=10",
    "lxml>=5",
    "scipy>=1.10",
    "apted>=1.0.3",
    # Capped <1.0: transformers 4.x is incompatible with hf-hub 1.x.
    # InternVL2 model code only works with transformers 4.45-4.49 (see
    # gpu optional extra), which forces this ceiling.
    "huggingface-hub>=0.26,<1.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    # Stage 9 paper figures (scripts/scaleup/make_figures.py). Generated
    # locally on the laptop, never on the GPU VM, so it lives in dev.
    "matplotlib>=3.7",
]
# Heavy ML stack — only needed on the GPU VM that actually runs
# adapter inference. Local development and unit tests do NOT need
# these (the InternVL2Adapter imports torch/transformers lazily).
# On the Deep Learning VM image (deeplearning-platform-release /
# pytorch-latest-gpu), these are typically preinstalled into the
# system Python; pinning them here lets `uv sync --extra gpu`
# create a reproducible venv on any L4-class machine.
gpu = [
    "torch>=2.1",
    # Capped <4.50: rename of `_tied_weights_keys` to
    # `all_tied_weights_keys` broke InternVL2's bundled modeling code.
    # 4.49 verified working on L4 with InternVL2-8B.
    "transformers>=4.45,<4.50",
    "torchvision>=0.16",
    "accelerate>=0.30",
    "timm>=0.9",
    "sentencepiece>=0.2",
    "einops>=0.7",
    # InternVL2-8B tokenizer extraction needs one of these:
    # SentencePiece path -> protobuf; TikToken fallback -> tiktoken.
    "protobuf>=4",
    "tiktoken>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
