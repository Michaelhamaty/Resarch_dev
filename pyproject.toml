[project]
name = "adaptive-inference"
version = "0.0.0"
description = "Matched-budget adaptive inference research MVP for complex English table pages."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6",
    "pillow>=10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
